name: Validate spell preparation presentation

on:
  push:
    branches:
      - 'ui/spell-prep-correct-zoom'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run focused spell presentation tests
        run: npx vitest run tests/state/useBattleController.spellPresentation.test.tsx tests/ui/battle/BattleScreen.spellPreparation.test.tsx
      - name: Run full test suite
        run: npm test
