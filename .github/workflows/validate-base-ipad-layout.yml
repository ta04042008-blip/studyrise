name: Validate Base iPad layout

on:
  push:
    branches:
      - 'fix/base-home-ipad-layout'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run Base home tests
        run: npx vitest run tests/ui/base/BaseHomeScreen.test.tsx tests/ui/base/responsive.test.tsx tests/state/useBaseController.partySave.test.tsx
