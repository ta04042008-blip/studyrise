name: Validate phone battle background fix

on:
  push:
    branches:
      - 'fix/phone-battle-background-crop'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run focused battle tests
        run: >
          npx vitest run
          tests/ui/battle/QuestionView.formats.test.tsx
          tests/ui/battle/QuestionView.scratchpad.test.tsx
          tests/ui/battle/BattleScreen.spellPreparation.test.tsx
          tests/state/useBaseController.saveResume.test.tsx
