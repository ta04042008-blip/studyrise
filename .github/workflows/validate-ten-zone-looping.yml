name: Validate ten-zone looping stages

on:
  push:
    branches:
      - 'feature/ten-zone-looping-stages'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run ten-zone focused regression suite
        run: >
          npx vitest run --testTimeout=30000
          tests/content/validateContent.test.ts
          tests/engine/stage/StageEngine.test.ts
          tests/engine/stage/stageValidation.test.ts
          tests/engine/stage/itemPool.test.ts
          tests/engine/progression/reconcileStageResult.test.ts
          tests/base/runSaveCompatibility.test.ts
          tests/state/useBaseController.runSaveCompatibility.test.tsx
          tests/state/StageSessionScreen.outcomes.test.tsx
          tests/state/StageSessionScreen.strictMode.test.tsx
          tests/state/useStageController.selfReturn.test.tsx
          tests/state/useStageController.multiZone.test.tsx
