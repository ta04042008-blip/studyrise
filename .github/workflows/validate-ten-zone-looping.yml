name: Validate ten-zone looping stages

on:
  push:
    branches:
      - 'feature/ten-zone-looping-stages'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run full regression suite
        run: npx vitest run --testTimeout=30000
