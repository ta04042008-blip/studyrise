name: Audit Base home and party save regression

on:
  push:
    branches:
      - 'audit/base-home-party-save-regression'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build and TypeScript
        run: npm run build -- --base=/studyrise/
      - name: Base, save and progression regression tests
        run: >
          npx vitest run
          tests/base
          tests/engine/save
          tests/engine/progression
          tests/state/useBaseController.flow.test.tsx
          tests/state/useBaseController.partySave.test.tsx
          tests/state/useBaseController.permanentReward.test.tsx
          tests/state/useBaseController.recordScreen.test.tsx
          tests/state/useBaseController.runSaveCompatibility.test.tsx
          tests/state/useBaseController.saveResume.test.tsx
          tests/ui/base
          tests/presentation/assets/studyRiseAssets.test.ts
