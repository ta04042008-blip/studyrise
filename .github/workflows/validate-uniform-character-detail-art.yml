name: Validate uniform character detail art

on:
  push:
    branches:
      - 'fix/uniform-character-detail-art-size'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run character detail and responsive tests
        run: >
          npx vitest run
          tests/ui/base/CharacterDetailView.test.tsx
          tests/ui/base/responsive.test.tsx
          tests/ui/base/BaseHomeScreen.test.tsx
