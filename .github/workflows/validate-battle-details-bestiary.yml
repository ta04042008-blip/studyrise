name: Validate battle details and Bestiary

on:
  push:
    branches:
      - 'feature/battle-details-bestiary'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and typecheck
        run: npm run build -- --base=/studyrise/
      - name: Run focused Bestiary regressions
        run: >
          npx vitest run --testTimeout=30000
          tests/engine/bestiary/BestiarySystem.test.ts
          tests/ui/base/BestiaryScreen.test.tsx
          tests/ui/battle/BattleActorDetailModal.test.tsx
          tests/state/useBattleController.bestiary.test.tsx
          tests/state/useBattleController.learningHistory.test.tsx
          tests/ui/base/BaseHomeScreen.test.tsx
          tests/ui/base/responsive.test.tsx
          tests/state/useBaseController.saveResume.test.tsx
